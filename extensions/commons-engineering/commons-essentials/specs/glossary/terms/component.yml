id: component
term: Component
layer: what
kind: concept
definition: 'A tangible part of a commons that one can point to: Commons CORE, LIBRARY, FABRIC, GRAPH and MCP, each with
  the practice of the same name.'
why: 'The components are proper names, written in capitals; a commons has them as [commons].core, [commons].graph and so
  on, and the Federation as federation.core, federation.mcp.'
