id: commons-core
term: Commons CORE
layer: why
kind: concept
definition: The cybernetic model of a commons' shared value creation; it gives orientation and shapes the future.
why: 'The value creation is regulated, not the people. Its guiding sentence: "The model''s present is its last commit
  — and the model holds the near future." It guides the work, which always works on the near future, and is no claim
  about reality: comparing commits shows how the model changed, not how reality drifted (commons.o#91, comment
  6470680520).'
relations:
