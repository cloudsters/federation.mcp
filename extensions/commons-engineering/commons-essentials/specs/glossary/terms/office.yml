id: office
term: Office
layer: how
kind: concept
definition: The working and coordination arrangement through which an accountable steward, together with the humans and agents serving their Posts, fulfils their mandates across the relevant Bodies.
why: One place for each steward's word lets it reach many Bodies; Offices multiply with stewards and never divide, and they hold no mandate of their own.
relations:
  part_of: body
status: accepted
