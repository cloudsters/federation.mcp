id: shell
term: Shell
layer: how
kind: concept
definition: 'A group of users who stand at the same closeness to a commons'' model, from SEED at the centre to ROAM
  outside; a commons adapts its own shells, and access follows the shell.'
why: 'A shell carries access, never mandate: governing is a mandate in a Body. Every user belongs to one shell of a
  commons, humans working with agents; at ROAM a caller need not be a user.'
relations:
  part_of: commons
  groups: user
not:
- ring
- orbit_level
status: accepted
decided:
