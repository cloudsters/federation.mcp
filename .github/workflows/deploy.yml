# Deploys the Worker federation-mcp to mcp.cloudsters.net/federation (H3, H4) on every merge to main.
# It reads two repository secrets and nothing else; no credential lives in this repository. Until both secrets are
# set, it checks and stops without deploying.
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - id: ready
        name: both secrets are set
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "go=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set: nothing is deployed"; fi
      - if: steps.ready.outputs.go == 'true'
        uses: actions/checkout@v4
      - if: steps.ready.outputs.go == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - if: steps.ready.outputs.go == 'true'
        name: build and test the transport before anything is deployed
        run: |
          pip install pyyaml jsonschema
          python -B deploy/build.py
          python -B tests/test_transport.py
      - if: steps.ready.outputs.go == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - if: steps.ready.outputs.go == 'true'
        uses: astral-sh/setup-uv@v6
      - if: steps.ready.outputs.go == 'true'
        name: deploy the Worker
        working-directory: worker
        run: uv run --python 3.13 pywrangler deploy
      - if: steps.ready.outputs.go == 'true'
        name: the deployed Worker answers a session's first call
        run: |
          sleep 20
          curl -sf -X POST https://mcp.cloudsters.net/federation -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"deploy","version":"0"}}}' \
            | tee answer.json | grep -q '"serverInfo"'
